<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100">
    <nav class="flex justify-between items-center bg-blue-500 text-white p-4">
        <h1 class="font-bold text-xl">My Website</h1>
        <div class="flex gap-4">
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </div>
    </nav>
    <h1 class="text-2xl font-bold text-center mt-8 mb-6">
        Welcome Back
    </h1>
    <div class="flex flex-wrap justify-center gap-4">
        <div class="bg-pink-300 p-10 text-center w-40">
            Box 1
        </div>
        <div class="bg-blue-300 p-10 text-center w-40">
            Box 2
        </div>
        <div class="bg-green-300 p-10 text-center w-40">
            Box 3
        </div>
    </div>
</body>
</html>
